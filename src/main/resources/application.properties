spring.application.name=Hotel_Management_System

spring.datasource.url=jdbc:mysql://localhost:3306/hotel_management_new?autoReconnect=true&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false



jwt.secret=NDgzMkQ0OEExRDlEQzk3RjEyOTQxRDlEQzk3RjEyOTQxRDlEQzk3RjEyOTQxRDlEQzk3
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=604800000


ai.enabled=true
ai.base-url=https://api.anthropic.com/v1/messages
ai.api-key=${ANTHROPIC_API_KEY:CHANGE_ME_SET_YOUR_ANTHROPIC_API_KEY}
ai.model=claude-sonnet-5
ai.max-tokens=600
ai.anthropic-version=2023-06-01

logging.level.root=INFO
logging.level.com.ijse.Hotel_Management_System=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/hotel-management-system.log


server.port=8080
spring.web.error.include-message=always
