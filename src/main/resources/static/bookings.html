<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My bookings — Just Click</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div id="app-header" style="display:contents;"></div>
</header>

<div id="toast"></div>

<main>
    <div class="page-head">
        <h2>My bookings</h2>
        <p>Everything you've reserved with Just Click.</p>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table id="bookings-table">
                <thead>
                    <tr><th>Hotel</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Guests</th><th>Total</th><th>Status</th><th></th></tr>
                </thead>
                <tbody id="bookings-table-body">
                    <tr class="empty-row"><td colspan="8">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="js/common.js"></script>
<script src="js/bookings.js"></script>
</body>
</html>
