<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotels — Just Click</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div id="app-header" style="display:contents;"></div>
</header>

<div id="toast"></div>

<main>
    <div class="page-head">
        <h2>Hotels</h2>
        <p>Browse hotels and see live room availability.</p>
    </div>

    <div class="stats-strip">
        <div class="stat-mini">
            <div class="num" id="stat-hotels">—</div>
            <div class="lbl">Hotels</div>
        </div>
        <div class="stat-mini">
            <div class="num" id="stat-rooms">—</div>
            <div class="lbl">Total rooms</div>
        </div>
        <div class="stat-mini">
            <div class="num" id="stat-available">—</div>
            <div class="lbl">Free tonight</div>
        </div>
    </div>

    <div class="toolbar">
        <div class="field" style="margin:0; min-width:200px;">
            <label>City</label>
            <select id="city-filter"><option value="">All cities</option></select>
        </div>
    </div>

    <div class="hotel-grid" id="hotel-grid"></div>
    <p class="text-muted hidden" id="hotel-grid-empty">No hotels found.</p>
</main>

<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
