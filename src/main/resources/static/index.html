<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceylon Collection — Hotel Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
<header class="header">
    <div class="brand" id="brand-home">
        <div class="logo">CC</div>
        <div>
            <div class="brand-name">Ceylon Collection</div>
            <div class="brand-sub">Hotel Management</div>
        </div>

        <div class="nav-right">
            <nav>
                <ul>
                    <li><a id="nav-hotels">Hotels</a></li>
                    <li><a id="nav-contact">Contact</a></li>
                    <li><a id="nav-admin" class="pill-flag" style="display:none;">Admin panel</a></li>
                </ul>
            </nav>
        </div>

        <div class="auth-buttons" id="auth-buttons">
            <button class="btn btn-ghost" id="open-login">Log in</button>
            <button class="btn btn-primary" id="open-register">Sign up</button>
        </div>


        <div class="user-chip" id="user-chip">
            <div class="avatar" id="user-avatar">?</div>
            <div class="user-menu" id="user-menu">
                <div class="who"><div class="n" id="user-name">—</div><div class="r" id="user-role">—</div></div>
                <button id="admin-menu-link" style="display:none;">Admin panel</button>
                <button id="logout-btn" class="danger">Log out</button>
            </div>
        </div>

    </div>


</header>

</body>

</html>
