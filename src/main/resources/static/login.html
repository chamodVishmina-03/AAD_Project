<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Just Click</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="toast"></div>

<div class="auth-shell">
    <div class="auth-card">
        <div class="logo">Jc</div>
        <h1>Sign in</h1>
        <p class="sub">Welcome back to Just Click Hotel Management</p>

        <div class="form-error" id="login-error"></div>

        <form id="login-form">
            <div class="field">
                <label>Email</label>
                <input type="email" id="login-email" required autocomplete="username" />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="login-password" required autocomplete="current-password" />
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">Sign in</button>
        </form>

        <div class="auth-switch">
            Don't have an account? <a href="register.html" class="link-btn">Create one</a>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
