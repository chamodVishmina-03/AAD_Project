<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account — Just Click</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="toast"></div>

<div class="auth-shell">
    <div class="auth-card">
        <div class="logo">Jc</div>
        <h1>Create account</h1>
        <p class="sub">Join Just Click to start booking hotels</p>

        <div class="form-error" id="register-error"></div>

        <form id="register-form">
            <div class="field">
                <label>Full name</label>
                <input type="text" id="register-fullname" required autocomplete="name" />
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="register-email" required autocomplete="username" />
            </div>
            <div class="field">
                <label>Phone</label>
                <input type="text" id="register-phone" autocomplete="tel" />
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="register-password" required minlength="6" autocomplete="new-password" />
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="register-submit-btn">Create account</button>
        </form>

        <div class="auth-switch">
            Already have an account? <a href="login.html" class="link-btn">Sign in</a>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script src="js/register.js"></script>
</body>
</html>
